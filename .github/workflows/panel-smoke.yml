name: panel-widgets-smoke

on:
  pull_request:
    paths: ["panel-widgets/**", ".github/workflows/panel-smoke.yml"]
  push:
    branches: ["agent/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Load panel widgets in Quickshell under nested KWin
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test in a disposable Arch container
        run: |
          docker run --rm -v "$PWD:/src:ro" archlinux:base-devel bash -c '
            pacman -Sy --noconfirm >/dev/null 2>&1
            pacman -S --noconfirm --needed kwin quickshell kscreenlocker qt6-wayland qt6-declarative mesa dbus ttf-dejavu libcap >/tmp/pacman.log 2>&1 || { tail -30 /tmp/pacman.log; exit 1; }
            getcap $(readlink -f /usr/bin/kwin_wayland); setcap -r $(readlink -f /usr/bin/kwin_wayland) 2>&1
            pacman -Q quickshell qt6-declarative kwin
            useradd -m dev
            su dev -c "dbus-run-session -- bash /src/panel-widgets/smoke.sh" 2>&1
          '

      # The panel smoke loads shell-spike.qml, which does not contain the dock. The dock variants get their
      # own load run so a QML syntax error in Dock/DockWindow/DockBar fails CI instead of only the VM.
      - name: Dock variants load in Quickshell (island, bar, unknown value)
        run: |
          docker run --rm -v "$PWD:/src:ro" archlinux:base-devel bash -c '
            pacman -Sy --noconfirm >/dev/null 2>&1
            pacman -S --noconfirm --needed kwin quickshell qt6-wayland qt6-declarative mesa dbus ttf-dejavu libcap >/tmp/pacman.log 2>&1 || { tail -30 /tmp/pacman.log; exit 1; }
            getcap $(readlink -f /usr/bin/kwin_wayland); setcap -r $(readlink -f /usr/bin/kwin_wayland) 2>&1
            useradd -m dev
            su dev -c "dbus-run-session -- bash /src/panel-widgets/dock-smoke.sh" 2>&1
          '
