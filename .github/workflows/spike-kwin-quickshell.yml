name: SPIKE (temporary) KWin virtual screen + Quickshell
on:
  workflow_dispatch:
    inputs:
      script:
        type: choice
        options: [run.sh, run2.sh, run3.sh, run4.sh]
        default: run.sh
      ref:
        description: branch to test under /pr
        default: main
permissions:
  contents: read
jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: pr
      - name: Run in a disposable Arch container
        run: |
          docker run --rm -e SPIKE_SCRIPT=${{ inputs.script }} -v "$PWD/spike:/spike:ro" -v "$PWD/pr:/pr:ro" archlinux:base-devel bash -c '
            pacman -Sy --noconfirm >/dev/null 2>&1
            pacman -S --noconfirm --needed kwin quickshell kscreenlocker spectacle foot wayland-utils qt6-wayland mesa dbus qt6-tools ttf-dejavu libcap gdb labwc grim plasma-wayland-protocols wayland-protocols wayland gcc libkscreen >/tmp/pacman.log 2>&1 || { tail -30 /tmp/pacman.log; exit 1; }
            for b in kwin_wayland labwc; do getcap $(readlink -f /usr/bin/$b); setcap -r $(readlink -f /usr/bin/$b) 2>&1; done
            pacman -Q kwin quickshell qt6-base qt6-declarative
            useradd -m dev
            cd /spike && wayland-scanner client-header /usr/share/plasma-wayland-protocols/plasma-window-management.xml /tmp/pwm-client.h && wayland-scanner private-code /usr/share/plasma-wayland-protocols/plasma-window-management.xml /tmp/pwm-code.c && gcc -Wno-incompatible-pointer-types -I/tmp -o /tmp/pwm pwm.c /tmp/pwm-code.c -lwayland-client 2>&1 | tail -20; chmod 755 /tmp/pwm
            su dev -c "dbus-run-session -- bash /spike/${SPIKE_SCRIPT:-run.sh}" 2>&1
          '
